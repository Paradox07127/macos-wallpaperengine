<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In</title>
</head>
<body class="flat_page responsive_page">
<div id="responsive_page_template_content">
  <div class="page_content">
    <div class="login_box">
      <h2>Sign in to your Steam account</h2>
      <form id="login_form" action="https://steamcommunity.com/login/" method="post">
        <input type="text" name="username" placeholder="Account name">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Sign in</button>
      </form>
      <p>Please verify you are a human before continuing.</p>
      <div class="captcha_placeholder"></div>
      <a href="https://steamcommunity.com/workshop/browse/?appid=431960">Back to the Workshop</a>
      <a href="https://help.steampowered.com/">Help</a>
    </div>
  </div>
</div>
</body>
</html>
