# SwiftLint — starter config (P0). Conservative + low-noise on first adoption.
# Length/complexity/naming rules are intentionally disabled here: enabling them
# now would drown the signal in known god-file violations.
# Whitespace rules are left to SwiftFormat to avoid double-reporting.

included:
  - LiveWallpaper
  - LiveWallpaperTests
  - Packages

excluded:
  - build
  - archived
  - cache
  - trace
  - tools
  - "**/.build"
  - "**/DerivedSources"
  - "**/DerivedData"
  - Packages/**/.build
  # AF-10 hotspot contract: every excluded Swift source below must appear in
  # scripts/quality-baselines/exclusions.json with a component owner, reason,
  # and expiry. scripts/check_quality_exclusions.py keeps this list exactly in
  # sync with SwiftFormat and applies component-level LoC/changed-line gates.
  # Build/cache exclusions above are generated artifacts, not source hotspots.
  # God-files slated for structural refactor (review doc §6.1, P-B): keep them
  # churn-free until they are split, so autofixes don't collide with the splits.
  # Expiry review (G4/breadth#7): re-check this list each fix cycle — an entry
  # leaves when its split lands. Status 2026-07-14: Dispatcher got the ADR-001
  # step-0 decomposition but remains oversized pending ADR-001 data migration →
  # keep excluded. SceneRenderer's split landed (B4), so it moved to the parts
  # list below. GeneralSettingsView was split (G8) and was never on this list.
  - LiveWallpaper/Playback/Web/HTMLWallpaperView.swift
  # WPEShaderTranspiler, ScreenManager, WPEMetalRenderExecutor (B3a/B3b/B3c) and
  # WPEMetalSceneRenderer (B4) were split. Every split was a pure move, so the
  # parts inherit the violations the monoliths were never held to — splitting a
  # file does not make it conform. The exclusions therefore follow the parts, but
  # their reason has changed: they now wait on a dedicated lint-cleanup pass, which
  # the splits unblocked and which must stay a separate commit so the autofixes are
  # reviewable apart from the code motion.
  - LiveWallpaper/App/ScreenManager.swift
  - LiveWallpaper/App/ScreenManagerTypes.swift
  - LiveWallpaper/App/ScreenManager+Observers.swift
  - LiveWallpaper/App/ScreenManager+Screens.swift
  - LiveWallpaper/App/ScreenManager+Wallpaper.swift
  - LiveWallpaper/App/ScreenManager+Overlays.swift
  - LiveWallpaper/App/ScreenManager+AmbientActivation.swift
  - LiveWallpaper/App/ScreenManager+SourceAccess.swift
  - LiveWallpaper/App/ScreenManager+Automation.swift

disabled_rules:
  - line_length
  - todo
  - identifier_name
  - type_name
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - function_parameter_count
  - trailing_whitespace
  - vertical_whitespace
  - opening_brace
  - trailing_comma

reporter: "xcode"

# G4 (review 2026-07-06 cycle-3): font-token bypass guards. High-precision forms
# only — general `.font(.system(size:))` expressions are not enforced because
# DESIGN.md rule 1 exempts standalone SF Symbol sizing. Revisit if
# an AST-based checker becomes available. Measured pt table: DESIGN.md Typography.
custom_rules:
  token_bypass_textstyle_font:
    name: "Inline text-style font"
    regex: '\.font\(\.system\(\.'
    message: "Use DesignTokens.Typography instead of .font(.system(.textStyle…)) — Core DESIGN.md rule 1"
    severity: warning
  # Raw semantic styles bypass tokens just as .system(.caption) does.
  token_bypass_bare_font:
    match_kinds: [identifier]
    name: "Bare text-style font"
    regex: '\.font\(\s*\.(largeTitle|title[23]?|headline|subheadline|body|callout|footnote|caption2?)(?![A-Za-z0-9_])'
    message: "Use DesignTokens.Typography instead of a bare semantic font (DESIGN.md rule 1)"
    severity: warning
  # High-precision Text/Label chains only. Standalone Image glyphs remain exempt;
  # complex expressions still need review rather than a broad, noisy regex.
  token_bypass_text_point_size:
    name: "Inline Text or Label point size"
    regex: '(?m)^[ \t]*(?:(let|var)\s+\w+\s*=\s*)?(Text|Label)\([^{}\n]*\)(\s*\.(?!font\b)[A-Za-z_]\w*\([^{}\n]*\))*\s*\.font\(\s*\.system\(\s*size:'
    message: "Text and Label use DesignTokens.Typography; precise point sizes are for standalone symbols (DESIGN.md rule 1)"
    severity: warning
  token_bypass_custom_font:
    name: "Inline custom font"
    regex: '\.font\(\.custom\('
    message: "Custom fonts are banned on Text/Label — use DesignTokens.Typography (DESIGN.md rule 1)"
    severity: warning
  # W0 (HIG UI-consistency program, 2026-08-31): token-bypass + wrapper-bypass
  # guards. Run scripts/check_ui_lint_probes.py after editing this section.
  # NOTE: standalone SF Symbol sizing remains exempt. The Text/Label rule
  # above only catches simple explicit modifier chains, not arbitrary expressions.
  token_bypass_literal_color:
    name: "Literal color value"
    regex: '(?<![A-Za-z0-9_])Color\((red:|\.sRGB\w*, *red:) *[0-9.]'
    message: "Use DesignTokens.Colors — literal RGB bypasses light/dark and Increase Contrast (DESIGN.md rule 2)"
    excluded: '.*/DesignTokens\.swift'
    severity: warning
  token_bypass_literal_corner_radius:
    name: "Literal corner radius"
    regex: 'cornerRadius:\s*[0-9]|\.cornerRadius\(\s*[0-9]|\.roundedRectangle\(\s*[0-9]'
    message: "Radii come from DesignTokens.Corner — no stray numbers (DESIGN.md rule 5)"
    excluded: '.*/DesignTokens\.swift'
    severity: warning
  glass_outside_wrapper:
    name: "Raw Liquid Glass API outside AdaptiveGlass"
    regex: '\.glassEffect\(|GlassEffectContainer|\.buttonStyle\(\.glass'
    message: "Use AdaptiveGlass (adaptiveGlassSurface/adaptiveGlassButton/…) — raw glass skips the macOS 26/14 tiering and Reduce Transparency (DESIGN.md rule 4)"
    excluded: '.*/AdaptiveGlass\.swift'
    severity: warning
  material_outside_wrapper:
    name: "Raw standard material outside AdaptiveGlass"
    regex: '\.(ultraThinMaterial|thinMaterial|regularMaterial|thickMaterial)\b'
    message: "Use AdaptiveGlass surfaces — raw materials skip Reduce Transparency handling (DESIGN.md rule 4)"
    excluded: '.*/AdaptiveGlass\.swift'
    severity: warning
  appex_tautological_availability:
    name: "Tautological macOS 26 gate in appex"
    regex: '(#|@)available\(macOS 26'
    message: "SystemWallpaperProvider deploys at 26.0 — this gate is always true; write the 26+ path unconditionally"
    included: '.*/SystemWallpaperProvider/.*'
    severity: warning
  circle_button_outside_wrapper:
    name: "Hand-rolled circular button"
    regex: '\.buttonBorderShape\(\.circle\)|adaptiveGlassButton\([^)]*shape:\s*\.circle'
    message: "Circular icon buttons go through GlassIconButton — its circle is DesignTokens.iconButtonDiameter; a hand-rolled one sizes itself from its glyph or misses the macOS 26 glass tier (w5-p2-spec §R1)"
    excluded: '.*/(AdaptiveGlass|GlassIconButton)\.swift'
    severity: warning
  # W5 (2026-08-31): a `Menu` with `.menuStyle(.borderlessButton)` is an AppKit
  # popup — it ignores the label's `foregroundStyle` and paints the glyph in the
  # system control colour. Over artwork or dark chrome that reads as a black,
  # invisible glyph (three sites shipped that way). Over-media glyph controls
  # use NativeMenuButton, which draws the label separately from native menu tracking.
  over_media_menu_style:
    name: "Over-media glyph uses a Menu"
    regex: 'foregroundStyle\(DesignTokens\.Colors\.(overlayForeground|onAccentFill)\)[\s\S]{0,240}?menuStyle\(\.borderlessButton\)'
    message: "An AppKit popup paints its label in the system control colour — use NativeMenuButton to draw the label separately from native menu tracking over media"
    severity: warning
