name: Multica bridge contracts

on:
  pull_request:
    paths:
      - 'scripts/multica/**'
      - 'tests/test_*.py'
      - '.github/workflows/multica-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/multica/**'
      - 'tests/test_*.py'
      - '.github/workflows/multica-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify bridge, review, and release contracts without live accounts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
