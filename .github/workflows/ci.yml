name: CI

# Build gate for both SKUs. The previous CI (release-loomscreen.yml, deleted in
# 3324b442) pinned Xcode 16.2 on macos-15 and died compiling
# AdaptiveGlass.swift (now LiveWallpaperCore/UI/Components) uses macOS 26 SDK APIs
# (glassEffect / GlassEffectContainer / .buttonStyle(.glass)) that do not exist
# in the macOS 15.x SDKs shipped with Xcode 16.x — #available gates the
# runtime, not the compile. This workflow pins Xcode 27.0 on the `xcode-27`
# image, matching the local shipping toolchain exactly.
#
# No secrets, no signing, no publishing — pure compile/test gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-app-tests:
        description: 'Also run the LiveWallpaperTests bundle (Pro scheme; slow, experimental on hosted runners)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode 27.0 beta == the toolchain shipping builds use locally. Seeds change
  # weekly, so this tracks major.minor only — no build number is pinned anywhere.
  # Only the `xcode-27` image label carries it (macOS 26.5 host); that image is
  # marked "preview" upstream, so expect occasional queueing. Pinned through the
  # stable symlink rather than /Applications/Xcode_27_beta_4.app, whose name
  # changes with every seed. The "Verify toolchain" step lists what is installed
  # so the pin can be bumped in one place.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    name: Build ${{ matrix.sku }} (${{ matrix.scheme }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - sku: pro
            scheme: LiveWallpaper
          - sku: lite
            scheme: LiveWallpaperLite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify toolchain
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos

      # Xcode 26+ ships the Metal compiler as a separate downloadable component,
      # and the xcode-27 image stopped carrying it on 2026-08-17 — every
      # CompileMetalFile then died with "cannot execute tool 'metal'".
      - name: Install Metal toolchain
        run: xcodebuild SWIFT_EMIT_LOC_STRINGS=NO -downloadComponent MetalToolchain

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify)
          else
            formatter=(cat)
          fi
          xcodebuild build \
            -project LiveWallpaper.xcodeproj \
            -scheme '${{ matrix.scheme }}' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.sku }}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.sku }}.log" \
            | "${formatter[@]}"

      - name: Tail raw build log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/build-${{ matrix.sku }}.log" || true

  package-tests:
    # Mirrors the SwiftPM section of scripts/release_candidate_check.sh:
    # every package that owns a test target, sequential to avoid shared
    # compiler/module-cache contention.
    name: Swift package tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Run package tests (sequential)
        run: make test-packages SWIFTPM_SCRATCH="$RUNNER_TEMP/SwiftPM"

  fast-app-contracts:
    # Hardware-free required shard. It catches source-layer dependency growth,
    # entitlement widening, trust/privacy regressions and localization drift on
    # every PR without running the Metal/display-heavy app suite.
    name: Fast app architecture/security contracts
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Install Metal toolchain
        run: xcodebuild SWIFT_EMIT_LOC_STRINGS=NO -downloadComponent MetalToolchain

      - name: Run hardware-free app contract shard
        run: make test-app-hosted DERIVED_DATA="$RUNNER_TEMP/DerivedData-contracts"

  release-contract:
    name: Release + quality tooling contract
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The quality ratchet compares component baselines and changed lines
          # against the PR/push base without depending on external tooling.
          fetch-depth: 0

      # Must precede every gate below, not just the lint one: scripts/i18n_guard.sh
      # shells out to ripgrep, which the runner image does not ship, and a missing
      # tool exits 127 rather than reporting a clean scan.
      - name: Install gate tooling
        run: brew install swiftlint swiftformat ripgrep

      - name: Validate portable release and quality tooling
        run: make contracts BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

      # Boundaries, the LoC ratchet and the whole-app localization scan used to
      # run only on a developer machine, so drift reached main unchallenged.
      - name: Structural and localization gates
        run: make fast BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

      # Ratchet, not a sweep: 827 of 940 files still differ from SwiftFormat at
      # whole-file granularity (measured 2026-08-31), so only lines this PR
      # touched are judged. A whole-repo gate would either stay red forever or
      # force a one-shot reformat that buries every semantic diff under it.
      - name: Lint the lines this change touched
        run: make lint BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

  app-tests:
    # Opt-in only (Actions tab -> CI -> Run workflow -> check the box).
    # The LiveWallpaperTests bundle is large and some tests touch
    # Metal/display; reliability on virtualized hosted runners is unproven.
    # Signing: no Apple cert on the runner, so force ad-hoc manual signing —
    # same approach scripts/release-app.sh uses for release archives.
    name: App unit tests (Pro scheme, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run-app-tests
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify toolchain
        run: xcodebuild -version

      - name: Install Metal toolchain
        run: xcodebuild SWIFT_EMIT_LOC_STRINGS=NO -downloadComponent MetalToolchain

      - name: Run LiveWallpaperTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LiveWallpaper.xcodeproj \
            -scheme LiveWallpaper \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tests" \
            -only-testing:LiveWallpaperTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            SWIFT_EMIT_LOC_STRINGS=NO
